name: TaskRabbit
kind: company
description: TaskRabbit is a gig-economy marketplace connecting customers with local,
  vetted Taskers for furniture assembly, handyman work, moving, and other home
  services. Ingka Group (IKEA) acquired TaskRabbit in 2017 and has since deepened
  the integration, including in-store and checkout-time TaskRabbit assembly booking
  at IKEA. TaskRabbit's original developer story dates to February 2012, when it
  ran an open API that let third-party to-do apps (Astrid, Producteev) create tasks
  on a user's behalf; that early open, self-serve API is long gone. In November
  2024 TaskRabbit acquired on-demand delivery company Dolly and rebranded its
  service as TaskRabbit Delivery. Today TaskRabbit operates one gated Partner API
  program (developer.taskrabbit.com) spanning two live surfaces - Delivery
  (built on Dolly's pre-existing Partner API, "PAPI") and a newer, 2025-12-versioned
  Home Services Partner Platform (Estimate, Availability, Bid, Book) that lets
  approved partners quote, book, and manage TaskRabbit projects, including IKEA-style
  furniture assembly, inside their own apps. Access requires partner approval
  (TaskRabbit reviews requests within about two business days) and Auth0 OAuth2
  client-credentials (machine-to-machine) tokens; there is no public self-serve
  signup and no published API price list, since commercial terms are negotiated
  per partner. End-customer pricing on TaskRabbit itself follows a standard
  Service Fee plus Trust & Support Fee structure layered on top of each Tasker's
  hourly rate.
